name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test

  test-action:
    name: GitHub Actions Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          update-command: 'echo update-command ran under bash'

      - name: Test Local Action (pwsh)
        id: test-action-pwsh
        uses: ./
        with:
          update-command: 'Write-Host "update-command ran under pwsh"'
          shell: pwsh

      - name: Test Local Action (commit-only)
        id: test-action-commit-only
        uses: ./

      - name: Print Output
        id: output
        shell: bash
        run: |
          echo "updated=${{ steps.test-action.outputs.updated }}"
          echo "updated (pwsh)=${{ steps.test-action-pwsh.outputs.updated }}"
          echo "updated (commit-only)=${{ steps.test-action-commit-only.outputs.updated }}"
